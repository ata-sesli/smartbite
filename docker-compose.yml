services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartbite
      POSTGRES_USER: smartbite
      POSTGRES_PASSWORD: smartbite
    ports:
      - "${SMARTBITE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${SMARTBITE_REDIS_PORT:-16379}:6379"

  api:
    build:
      context: .
      args:
        SMARTBITE_INSTALL_AI: "0"
    command: /bin/sh /app/app/scripts/start_api_with_migrations.sh
    environment:
      SMARTBITE_ONE_SHOT_TIMEOUT_SECONDS: "45"
      SMARTBITE_DATABASE_URL: postgresql+asyncpg://smartbite:smartbite@postgres:5432/smartbite
      SMARTBITE_REDIS_URL: redis://redis:6379/0
      SMARTBITE_STORAGE_ROOT: /app/data/storage
      SMARTBITE_OCR_DEVICE_MODE: auto
      SMARTBITE_PARSEQ_MODEL_DIR: models/parseq-small
      SMARTBITE_PARSEQ_DEVICE_MODE: auto
      SMARTBITE_OCR_PPOCRV5_USE_CUSTOM_TEXT_DET_MODEL: "true"
      SMARTBITE_OCR_PPOCRV5_TEXT_DET_MODEL_DIR: models/pp-ocrv5-text-detection/best_model_inference
      SMARTBITE_OCR_PPOCRV5_USE_ANGLE_CLS: "true"
      SMARTBITE_OCR_PPOCRV5_DET_DB_THRESH: "0.25"
      SMARTBITE_OCR_PPOCRV5_DET_DB_BOX_THRESH: "0.35"
      SMARTBITE_OCR_PPOCRV5_DET_LIMIT_SIDE_LEN: "1216"
      SMARTBITE_OCR_PPOCRV5_DET_LIMIT_TYPE: max
      SMARTBITE_OCR_PPOCRV5_DET_DB_UNCLIP_RATIO: "1.8"
      SMARTBITE_GLM_OCR_MODEL_DIR: models/glm-ocr
      SMARTBITE_GLM_OCR_DEVICE_MODE: auto
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      SMARTBITE_MIGRATION_MAX_RETRIES: 30
      SMARTBITE_MIGRATION_RETRY_SECONDS: 2
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    ports:
      - "${SMARTBITE_API_PORT:-8005}:${SMARTBITE_API_PORT:-8005}"

  worker:
    build:
      context: .
      args:
        SMARTBITE_INSTALL_AI: "1"
    command: smartbite-worker
    profiles:
      - docker-worker
    environment:
      SMARTBITE_DATABASE_URL: postgresql+asyncpg://smartbite:smartbite@postgres:5432/smartbite
      SMARTBITE_REDIS_URL: redis://redis:6379/0
      SMARTBITE_STORAGE_ROOT: /app/data/storage
      SMARTBITE_OCR_DEVICE_MODE: auto
      SMARTBITE_PARSEQ_MODEL_DIR: models/parseq-small
      SMARTBITE_PARSEQ_DEVICE_MODE: auto
      SMARTBITE_OCR_PPOCRV5_USE_CUSTOM_TEXT_DET_MODEL: "true"
      SMARTBITE_OCR_PPOCRV5_TEXT_DET_MODEL_DIR: models/pp-ocrv5-text-detection/best_model_inference
      SMARTBITE_OCR_PPOCRV5_USE_ANGLE_CLS: "true"
      SMARTBITE_OCR_PPOCRV5_DET_DB_THRESH: "0.25"
      SMARTBITE_OCR_PPOCRV5_DET_DB_BOX_THRESH: "0.35"
      SMARTBITE_OCR_PPOCRV5_DET_LIMIT_SIDE_LEN: "1216"
      SMARTBITE_OCR_PPOCRV5_DET_LIMIT_TYPE: max
      SMARTBITE_OCR_PPOCRV5_DET_DB_UNCLIP_RATIO: "1.8"
      SMARTBITE_GLM_OCR_MODEL_DIR: models/glm-ocr
      SMARTBITE_GLM_OCR_DEVICE_MODE: auto
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
