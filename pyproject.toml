[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartbite"
version = "0.1.0"
description = "SmartBite V1 backend and AI pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litestar>=2.12.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.31",
  "greenlet>=3.0.3",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.3.4",
  "python-multipart>=0.0.9",
  "arq>=0.26.0",
  "httpx>=0.27.0",
  "numpy>=1.26.4",
  "pillow>=10.4.0",
  "opencv-python-headless>=4.10.0.84",
]

[project.optional-dependencies]
ai = [
  "paddleocr>=2.8.1",
  "paddlepaddle==3.0.0",
  "onnxruntime>=1.18.0",
  "ultralytics>=8.2.0",
  "sahi>=0.11.36",
  "torch>=2.3.1",
  "craft-detector>=0.2.1",
  "timm>=1.0.20",
  "pytorch-lightning>=2.5.0",
  "rapidocr>=3.8.1",
  "nltk>=3.9.0",
  "huggingface-hub>=0.31.0",
  "chardet>=5,<6",
]
export = [
  "paddle2onnx>=2.0.0",
  "onnx>=1.16,<1.18",
  "onnxslim>=0.1.71",
]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
]

[project.scripts]
smartbite-api = "app.main:run"
smartbite-worker = "app.worker_main:run"
smartbite-prefetch-models = "app.scripts.prefetch_models:main"
smartbite-export-onnx-models = "app.scripts.export_onnx_models:main"
smartbite-yolo-onnx-parity = "app.scripts.yolo_onnx_parity:main"
smartbite-svtr-onnx-parity = "app.scripts.svtr_onnx_parity:main"
smartbite-mobile-test64-upload = "app.scripts.mobile_test64_upload_benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "web*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
