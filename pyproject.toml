[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartbite"
version = "0.1.0"
description = "SmartBite V1 backend and AI pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litestar>=2.12.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.31",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.3.4",
  "python-multipart>=0.0.9",
  "arq>=0.26.0",
  "httpx>=0.27.0",
  "numpy>=1.26.4",
  "pillow>=10.4.0",
  "opencv-python-headless>=4.10.0.84",
]

[project.optional-dependencies]
ai = [
  "onnxruntime>=1.18.1",
  "paddleocr>=2.8.1",
  "ultralytics>=8.2.0",
  "torch>=2.3.1",
]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
]

[project.scripts]
smartbite-api = "app.main:run"
smartbite-worker = "app.worker_main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
