[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartbite"
version = "0.1.0"
description = "SmartBite V1 backend and AI pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litestar>=2.12.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.31",
  "greenlet>=3.0.3",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.3.4",
  "python-multipart>=0.0.9",
  "arq>=0.26.0",
  "httpx>=0.27.0",
  "numpy>=1.26.4",
  "pillow>=10.4.0",
  "opencv-python-headless>=4.10.0.84",
]

[project.optional-dependencies]
ai = [
  "paddleocr>=2.8.1",
  "paddlepaddle>=3.2.0,<3.3.0",
  "ultralytics>=8.2.0",
  "torch>=2.3.1",
  "chardet>=5,<6",
]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
]

[project.scripts]
smartbite-api = "app.main:run"
smartbite-worker = "app.worker_main:run"
smartbite-finetune-ppocrv5-rec = "app.scripts.finetune_ppocrv5_rec:main"
smartbite-build-ppocrv5-rec-dataset = "app.scripts.build_ppocrv5_rec_dataset:main"
smartbite-generate-ppocrv5-rec-candidates = "app.scripts.generate_ppocrv5_rec_candidates:main"
smartbite-build-ppocrv5-rec-date-dataset = "app.scripts.build_ppocrv5_rec_date_dataset:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "web*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
